services:
  - type: web
    name: disaster-mapping-jabalpur
    runtime: docker
    region: singapore
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    dockerContext: .
    disk:
      name: disaster-mapping-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: OUTPUT_DIR
        value: /var/data/output
      - key: MQTT_ENABLED
        value: "false"
      - key: REGION_NAME
        value: Jabalpur, Madhya Pradesh
      - key: REGION_LAT
        value: "23.181"
      - key: REGION_LON
        value: "79.951"
      - key: REGION_RADIUS_KM
        value: "250"
      - key: ADMIN_API_KEY
        generateValue: true
