services:
  - type: web
    name: disaster-mapping-jabalpur
    runtime: docker
    region: singapore
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DATA_DIR
        value: /tmp/disaster-mapping-data
      - key: OUTPUT_DIR
        value: /tmp/disaster-mapping-output
      - key: MQTT_ENABLED
        value: "false"
      - key: FAMILY_SHARING_ENABLED
        value: "true"
      - key: REGION_NAME
        value: Jabalpur, Madhya Pradesh
      - key: REGION_LAT
        value: "23.181"
      - key: REGION_LON
        value: "79.951"
      - key: REGION_RADIUS_KM
        value: "250"
      - key: ADMIN_API_KEY
        generateValue: true
